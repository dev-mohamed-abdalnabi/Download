name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organize flat files into project folders
        run: |
          mkdir -p app/src/main/java/app/grab app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi
          cp app-build.gradle.kts app/build.gradle.kts
          cp proguard-rules.pro app/proguard-rules.pro
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp Engine.kt MainActivity.kt UI.kt app/src/main/java/app/grab/
          cp themes.xml colors.xml app/src/main/res/values/
          cp ic_fg.xml app/src/main/res/drawable/
          cp ic_launcher.xml app/src/main/res/mipmap-anydpi/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create signing key (personal use)
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Grab-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
