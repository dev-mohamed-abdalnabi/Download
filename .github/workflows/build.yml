name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organize flat files into project folders
        run: |
          mkdir -p app/src/main/java/app/grab app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi
          cp app-build.gradle.kts app/build.gradle.kts
          cp proguard-rules.pro app/proguard-rules.pro
          cp grab.jks app/grab.jks
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp Engine.kt MainActivity.kt UI.kt app/src/main/java/app/grab/
          cp themes.xml colors.xml app/src/main/res/values/
          cp ic_fg.xml app/src/main/res/drawable/
          cp ic_launcher.xml app/src/main/res/mipmap-anydpi/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk Grab.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Grab (latest build)
          body: "Build #${{ github.run_number }} - ${{ github.sha }}"
          files: Grab.apk
          make_latest: true
